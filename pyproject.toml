[project]
name = "torch-cfd"
version = "0.0.0"
description = "PyTorch Computational Fluid Dynamics Library"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Shuhao Cao", email = "scao.math@gmail.com" }]
keywords = [
    "pytorch",
    "cfd",
    "pde",
    "spectral",
    "fluid dynamics",
    "deep learning",
    "neural operator",
]
# Match the research repo interpreter so the cu132 torch wheels line up.
requires-python = "==3.12.*"
dependencies = [
    # Upgraded from the pinned torch==2.6.0 to match the research repo
    # (torch 2.12.0+cu132); see [tool.uv.sources] / [[tool.uv.index]] below.
    "torch>=2.12.0",
    "numpy>=2.2.2",
    "scipy>=1.13.0",
    "xarray>=2025.3.1",
    "h5py>=3.13.0",
    "tensordict>=0.7.2",
    "einops>=0.8.0",
    "dill>=0.4.0",
    "tqdm>=4.62.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.13.0",
    "plotly>=6.0.0",
    "psutil>=7.0.0",
    "absl-py>=2.2.2",
    "pytest>=8.3.5",
    # Needed by the Hydra-parametrized scripts/dataset_generation_torch_cfd/create_dataset.py
    "hydra-core>=1.3.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.12",
]

[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

# Only torch_cfd is a declared/distributed package (matches the old setup.py
# find_packages). The top-level fno/ package is NOT declared here on purpose:
# it is made importable via the editable "compat" install mode below, which
# puts the repo root on sys.path (legacy `develop` behavior).
[tool.setuptools.packages.find]
include = ["torch_cfd*"]

[tool.uv]
# "pip compatibility" editable install: setuptools writes a .pth pointing at the
# repo root, so BOTH torch_cfd and the undeclared top-level fno/ import cleanly.
config-settings = { editable_mode = "compat" }
python-preference = "only-managed"

[tool.uv.sources]
torch = [{ index = "pytorch-cu132" }]

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true
