# Kolmogorov 2D, Re=1000, TEST split.
# 16 samples on a 512 grid, saved at 64x64 (subsample 8).
#
# Seeds are `seed + rank * batch_size`. Keep splits disjoint, e.g. give each
# split/Re in the sweep its own random base.
defaults:
  - base_config
  - _self_

split: test
dataset_name: 2dk_re_sweep
seed: 1574412924

num_samples: 16
batch_size: 16

grid_size: 512
subsample: 8
Re: 1000

time_warmup: 4.5   # warmup, discarded (sim seconds)
time: 20.0         # trajectory, recorded (sim seconds)
