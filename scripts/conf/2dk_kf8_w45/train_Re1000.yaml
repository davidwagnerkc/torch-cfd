# @package _global_
# 2dk_kf8_w45 -- train split, Re=1000, peak_wavenumber=8 (forcing moved from k=4 to k=8).
# Everything else = the w45/25M recipe: 45s warmup, 55s trajectories, 512^2 spectral -> 64^2.
# 128 traj x (7843-16) = 1.00M unique step-16 windows (the "sub1M-scale" corpus at k_f=8).
#
# ✅ CERTIFIED 2026-08-03 by 2dk_kf8_probe (8 traj, 150 s from t=0):
#   1. STATIONARITY: equilibrates by t~15-25 s; E flat 0.51-0.54 over 148 s (ratios at
#      t=30/45/60/90 s within 0.96-1.01 of stationary mean) => the inherited 45 s warmup
#      is conservative and correct. No condensate/quasisteady drift observed.
#   2. CFL: stationary |u|_max = 3.0-3.6 vs the assumed max_velocity=7.0 that sizes dt
#      (the 7.27 reading is the t=0 IC, scaled to 7.0 by construction) => dt UNCHANGED,
#      so frame dt matches every other corpus and k*/t80 scales stay comparable.
#   3. Re LABEL: nominal Re=1000 keeps nu=1e-3, but this is a WEAKER, more enstrophy-
#      dominated flow than k_f=4: E 0.53 vs 0.97, Z 16.1 vs 9.5, u_rms 1.03 vs 1.39,
#      forcing-scale Re 809 vs 2190. This cell changes flux topology AND effective Re;
#      a matched-Re_f variant would need the forcing amplitude raised ~2.7x, not just k_f.
defaults:
  - /base_config
  - _self_
split: train
dataset_name: 2dk_kf8_w45
seed: 1700200000
num_samples: 128
batch_size: 16
grid_size: 512
subsample: 8
Re: 1000
peak_wavenumber: 8
time_warmup: 45.0
time: 55.0
downsample_method: spectral
