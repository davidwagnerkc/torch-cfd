# @package _global_
# Kolmogorov 2D Re sweep -- train split, Re=1000.
# Part of dataset '2dk_re_sweep'; every split/Re shares that name and combines per split
# (shards are Re-tagged so they coexist). Seed is unique to this file.
defaults:
  - /base_config
  - _self_

split: train
dataset_name: 2dk_re_sweep
seed: 1601810600

num_samples: 32
batch_size: 16

grid_size: 512
subsample: 8
Re: 1000

time_warmup: 4.5
time: 55.0
